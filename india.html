<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathéo Lastavel — India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Montserrat:wght@200;300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0a0a;
    --white: #f5f2ed;
    --muted: #4a4a4a;
    --nav-height: 56px;
  }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-weight: 200;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── NAV ─── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2.5rem;
    height: var(--nav-height);
    background: var(--black);
  }

  .nav-logo {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--white);
    text-decoration: none;
  }

  .nav-right {
    display: flex;
    gap: 2rem;
  }

  .nav-right a {
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.25s;
  }

  .nav-right a:hover { color: var(--white); }

  /* ─── MENU DÉROULANT WORKS ─── */
  .nav-works {
    position: relative;
  }

  .nav-works-toggle {
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    cursor: pointer;
    transition: color 0.25s;
    background: none;
    border: none;
    font-family: inherit;
    font-weight: 200;
    padding: 0;
  }

  .nav-works-toggle:hover { color: var(--white); }

  .works-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    background: var(--black);
    border: 0.5px solid #222;
    padding: 1rem 1.5rem;
    min-width: 160px;
    flex-direction: column;
    gap: 0.6rem;
  }

  .works-dropdown.open { display: flex; }

  .works-dropdown a {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
    white-space: nowrap;
  }

  .works-dropdown a:hover { color: var(--white); }
  .works-dropdown a.active { color: var(--white); }

  /* ─── HERO ─── */
  .hero {
    margin-top: var(--nav-height);
    width: 100%;
    overflow: hidden;
  }

  .hero img {
    width: 100%;
    height: 90vh;
    object-fit: cover;
    display: block;
    filter: brightness(0.88);
  }

  /* ─── TITLE BLOCK ─── */
  .title-block {
    padding: 5rem 2.5rem 3.5rem;
  }

  .title-block h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(3.5rem, 8vw, 7rem);
    letter-spacing: 0.08em;
    color: var(--white);
    line-height: 0.95;
  }

  .title-block .year {
    font-size: 0.6rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 1rem;
  }

  /* ─── SCROLL LINE ─── */
  .scroll-line {
    width: 0.5px;
    height: 0;
    background: #222;
    margin: 0 auto 0;
    animation: growLine 1.2s ease forwards;
    animation-delay: 0.3s;
  }

  @keyframes growLine {
    to { height: 60px; }
  }

  /* ─── GALLERY ─── */
  .gallery {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .gallery-item {
    width: 100%;
    overflow: hidden;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  .gallery-item.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .gallery-item img {
    width: 100%;
    display: block;
    object-fit: cover;
    filter: brightness(0.9) contrast(1.02);
    transition: transform 0.7s ease;
  }

  .gallery-item:hover img {
    transform: scale(1.008);
  }

  /* Tailles */
  .gallery-item.tall img    { height: 88vh; }
  .gallery-item.medium img  { height: 65vh; }
  .gallery-item.short img   { height: 48vh; }

  /* Retrait latéral */
  .gallery-item.inset {
    padding: 0 6vw;
  }

  /* ─── REPLACE ZONE ─── */
  .photo-placeholder {
    width: 100%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .photo-placeholder span {
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #2a2a2a;
  }

  /* ─── NAV SÉRIES ─── */
  .nav-series {
    display: flex;
    justify-content: space-between;
    padding: 5rem 2.5rem;
    margin-top: 4rem;
    border-top: 0.5px solid #1a1a1a;
  }

  .nav-series a {
    font-size: 0.6rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.25s;
  }

  .nav-series a:hover { color: var(--white); }

  /* ─── FOOTER ─── */
  footer {
    padding: 2rem 2.5rem;
    display: flex;
    justify-content: space-between;
  }

  footer a, footer span {
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #2a2a2a;
    text-decoration: none;
    transition: color 0.25s;
  }

  footer a:hover { color: var(--muted); }

  /* ─── MOBILE ─── */
  @media (max-width: 600px) {
    nav { padding: 0 1.25rem; }
    .nav-right { gap: 1.2rem; }
    .title-block { padding: 3rem 1.25rem 2.5rem; }
    .gallery-item.inset { padding: 0 3vw; }
    .nav-series { padding: 3rem 1.25rem; }
    footer { padding: 1.5rem 1.25rem; flex-direction: column; gap: 0.5rem; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Mathéo Lastavel</a>
  <div class="nav-right">
    <div class="nav-works">
      <button class="nav-works-toggle" id="worksToggle">Works</button>
      <div class="works-dropdown" id="worksDropdown">
        <a href="india.html" class="active">India</a>
        <a href="nepal.html">Nepal</a>
        <a href="trek.html">Trek</a>
        <a href="andros.html">Andros</a>
        <a href="monks.html">Monks</a>
        <a href="french-pyrenees.html">French Pyrénées</a>
        <a href="asia-colour.html">Asia Colour</a>
      </div>
    </div>
    <a href="mailto:contact@matheo-lastavel.com">Contact</a>
    <a href="https://instagram.com/" target="_blank">Instagram</a>
  </div>
</nav>

<!-- HERO : remplace le src par ta première photo de la série -->
<div class="hero">
  <img
    src="https://images.squarespace-cdn.com/content/v1/6a11b20ce3be920c11a8a16a/710197bd-11ec-48b2-a429-19aaa7992a01/L1005701.jpg"
    alt="India — photo principale"
    loading="eager"
  >
</div>

<div class="title-block">
  <h1>India</h1>
  <div class="year">2026</div>
</div>

<div class="scroll-line"></div>

<!-- ════════════════════════════════════════════
     GALERIE — remplace chaque src="" par tes photos.
     Tu peux mettre tes images dans un dossier /images/india/
     et écrire src="images/india/photo1.jpg"

     Classes disponibles :
       tall   = 88vh de hauteur
       medium = 65vh
       short  = 48vh
       inset  = légèrement en retrait sur les côtés
     Mélange-les pour varier le rythme.
════════════════════════════════════════════ -->
<div class="gallery">

  <div class="gallery-item tall">
    <img src="images/india/photo1.jpg" alt="">
  </div>

  <div class="gallery-item medium inset">
    <img src="images/india/photo2.jpg" alt="">
  </div>

  <div class="gallery-item tall">
    <img src="images/india/photo3.jpg" alt="">
  </div>

  <div class="gallery-item short inset">
    <img src="images/india/photo4.jpg" alt="">
  </div>

  <div class="gallery-item tall">
    <img src="images/india/photo5.jpg" alt="">
  </div>

  <div class="gallery-item medium">
    <img src="images/india/photo6.jpg" alt="">
  </div>

  <div class="gallery-item tall inset">
    <img src="images/india/photo7.jpg" alt="">
  </div>

  <div class="gallery-item medium">
    <img src="images/india/photo8.jpg" alt="">
  </div>

  <!-- Ajoute autant de blocs que tu as de photos -->

</div>

<!-- Navigation entre séries — adapte les liens prev/next selon l'ordre de tes séries -->
<div class="nav-series">
  <a href="asia-colour.html">← Asia Colour</a>
  <a href="nepal.html">Nepal →</a>
</div>

<footer>
  <span>© 2026 Mathéo Lastavel</span>
  <a href="mailto:contact@matheo-lastavel.com">contact@matheo-lastavel.com</a>
</footer>

<script>
  /* Menu Works */
  const toggle = document.getElementById('worksToggle');
  const dropdown = document.getElementById('worksDropdown');

  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdown.classList.toggle('open');
  });

  document.addEventListener('click', () => dropdown.classList.remove('open'));

  /* Apparition au scroll */
  const items = document.querySelectorAll('.gallery-item');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.06 });

  items.forEach(item => observer.observe(item));
</script>

</body>
</html>
