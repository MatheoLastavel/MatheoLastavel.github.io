<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathéo Lastavel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Montserrat:wght@200;300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0a0a;
    --white: #f5f2ed;
    --muted: #4a4a4a;
  }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-weight: 200;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── NAV ─── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2.5rem;
    height: 56px;
  }

  .nav-logo {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--white);
    text-decoration: none;
  }

  .nav-right {
    display: flex;
    gap: 2rem;
  }

  .nav-right a {
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.25s;
  }

  .nav-right a:hover { color: var(--white); }

  /* ─── MAIN ─── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 56px 2rem 4rem;
  }

  /* ─── NOM ─── */
  .name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(2.8rem, 7vw, 5.5rem);
    letter-spacing: 0.08em;
    color: var(--white);
    margin-bottom: 3rem;
    opacity: 0;
    animation: fadeUp 1.2s ease forwards;
    animation-delay: 0.2s;
  }

  /* ─── SÉRIES ─── */
  .series-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }

  .series-list li {
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
  }

  .series-list li:nth-child(1) { animation-delay: 0.5s; }
  .series-list li:nth-child(2) { animation-delay: 0.62s; }
  .series-list li:nth-child(3) { animation-delay: 0.74s; }
  .series-list li:nth-child(4) { animation-delay: 0.86s; }
  .series-list li:nth-child(5) { animation-delay: 0.98s; }
  .series-list li:nth-child(6) { animation-delay: 1.1s; }
  .series-list li:nth-child(7) { animation-delay: 1.22s; }

  .series-list a {
    font-family: 'Montserrat', sans-serif;
    font-weight: 200;
    font-size: clamp(0.65rem, 1.2vw, 0.72rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    display: inline-block;
    padding: 0.55rem 0;
    position: relative;
    transition: color 0.3s;
  }

  .series-list a::after {
    content: '';
    position: absolute;
    bottom: 0.45rem;
    left: 0;
    width: 0;
    height: 0.5px;
    background: var(--white);
    transition: width 0.35s ease;
  }

  .series-list a:hover {
    color: var(--white);
  }

  .series-list a:hover::after {
    width: 100%;
  }

  /* ─── FOOTER ─── */
  footer {
    padding: 1.5rem 2.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  footer a, footer span {
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.25s;
  }

  footer a:hover { color: var(--white); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ─── MOBILE ─── */
  @media (max-width: 600px) {
    nav { padding: 0 1.25rem; }
    .nav-right { gap: 1.2rem; }
    footer { padding: 1.5rem 1.25rem; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Mathéo Lastavel</a>
  <div class="nav-right">
    <a href="mailto:contact@matheo-lastavel.com">Contact</a>
    <a href="https://instagram.com/" target="_blank">Instagram</a>
  </div>
</nav>

<main>
  <h1 class="name">Mathéo Lastavel</h1>

  <ul class="series-list">
    <li><a href="india.html">India</a></li>
    <li><a href="nepal.html">Nepal</a></li>
    <li><a href="trek.html">Trek</a></li>
    <li><a href="andros.html">Andros</a></li>
    <li><a href="monks.html">Monks</a></li>
    <li><a href="french-pyrenees.html">French Pyrénées</a></li>
    <li><a href="asia-colour.html">Asia Colour</a></li>
  </ul>
</main>

<footer>
  <span>© 2026 Mathéo Lastavel</span>
  <a href="mailto:contact@matheo-lastavel.com">contact@matheo-lastavel.com</a>
</footer>

</body>
</html>
