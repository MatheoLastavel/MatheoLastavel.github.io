<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathéo Lastavel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Montserrat:wght@200;300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0a0a;
    --white: #f5f2ed;
    --muted: #4a4a4a;
  }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-weight: 200;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ─── BACKGROUND IMAGE ─── */
  .bg-cover {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }

  .bg-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.35);
  }

  .bg-cover.visible { opacity: 1; }

  /* ─── NAV ─── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2.5rem;
    height: 56px;
  }

  .nav-logo {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--white);
    text-decoration: none;
  }

  .nav-right {
    display: flex;
    gap: 2rem;
  }

  .nav-right a {
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.25s;
  }

  .nav-right a:hover { color: var(--white); }

  /* ─── MAIN ─── */
  main {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 2rem 4rem;
    text-align: center;
  }

  /* ─── NOM ─── */
  .name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(2.8rem, 7vw, 5.5rem);
    letter-spacing: 0.08em;
    color: var(--white);
    margin-bottom: 3.5rem;
    opacity: 0;
    animation: fadeUp 1.2s ease forwards;
    animation-delay: 0.2s;
  }

  /* ─── SÉRIES ─── */
  .series-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .series-list li {
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
    width: 100%;
    text-align: center;
  }

  .series-list li:nth-child(1) { animation-delay: 0.45s; }
  .series-list li:nth-child(2) { animation-delay: 0.56s; }
  .series-list li:nth-child(3) { animation-delay: 0.67s; }
  .series-list li:nth-child(4) { animation-delay: 0.78s; }
  .series-list li:nth-child(5) { animation-delay: 0.89s; }
  .series-list li:nth-child(6) { animation-delay: 1.0s; }
  .series-list li:nth-child(7) { animation-delay: 1.11s; }

  .series-list a {
    font-family: 'Montserrat', sans-serif;
    font-weight: 200;
    font-size: clamp(0.62rem, 1.1vw, 0.7rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    display: inline-block;
    padding: 0.65rem 1rem;
    transition: color 0.3s, letter-spacing 0.3s;
    position: relative;
  }

  .series-list a:hover {
    color: var(--white);
    letter-spacing: 0.45em;
  }

  /* ─── FOOTER ─── */
  footer {
    position: relative;
    z-index: 10;
    padding: 1.5rem 2.5rem;
    display: flex;
    justify-content: space-between;
  }

  footer a, footer span {
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.25s;
  }

  footer a:hover { color: var(--white); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    nav { padding: 0 1.25rem; }
    footer { padding: 1.5rem 1.25rem; flex-direction: column; gap: 0.4rem; }
  }
</style>
</head>
<body>

<!-- IMAGE DE FOND qui apparaît au hover -->
<div class="bg-cover" id="bgCover">
  <img src="" alt="" id="bgImg">
</div>

<nav>
  <a href="index.html" class="nav-logo">Mathéo Lastavel</a>
  <div class="nav-right">
    <a href="mailto:contact@matheo-lastavel.com">Contact</a>
    <a href="https://instagram.com/" target="_blank">Instagram</a>
  </div>
</nav>

<main>
  <h1 class="name">Mathéo Lastavel</h1>

  <ul class="series-list">
    <!--
      data-cover = chemin vers ta photo de couverture de la série
      Exemple : data-cover="images/india/cover.jpg"
    -->
    <li>
      <a href="india.html" data-cover="images/india/cover.jpg">India</a>
    </li>
    <li>
      <a href="nepal.html" data-cover="images/nepal/cover.jpg">Nepal</a>
    </li>
    <li>
      <a href="trek.html" data-cover="images/trek/cover.jpg">Trek</a>
    </li>
    <li>
      <a href="andros.html" data-cover="images/andros/cover.jpg">Andros</a>
    </li>
    <li>
      <a href="monks.html" data-cover="images/monks/cover.jpg">Monks</a>
    </li>
    <li>
      <a href="french-pyrenees.html" data-cover="images/french-pyrenees/cover.jpg">French Pyrénées</a>
    </li>
    <li>
      <a href="asia-colour.html" data-cover="images/asia-colour/cover.jpg">Asia Colour</a>
    </li>
  </ul>
</main>

<footer>
  <span>© 2026 Mathéo Lastavel</span>
  <a href="mailto:contact@matheo-lastavel.com">contact@matheo-lastavel.com</a>
</footer>

<script>
  const bgCover = document.getElementById('bgCover');
  const bgImg   = document.getElementById('bgImg');
  const links   = document.querySelectorAll('.series-list a[data-cover]');

  links.forEach(link => {
    link.addEventListener('mouseenter', () => {
      bgImg.src = link.dataset.cover;
      bgCover.classList.add('visible');
    });
    link.addEventListener('mouseleave', () => {
      bgCover.classList.remove('visible');
    });
  });
</script>

</body>
</html>
